version: '3.8'

services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-provisioning/dashboards/default.yml:/etc/grafana/provisioning/dashboards/default.yml
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-storage:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=http://127.0.0.1:3000
      - GF_INFLUXDB_TOKEN_FILE=/run/secrets/influxdb_token
    secrets:
          - influxdb_token
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana-storage:

secrets:
  influxdb_token:
    file: ./secrets/influxdb_token.txt